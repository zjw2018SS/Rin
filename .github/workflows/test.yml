name: CI - Test and Type Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run server tests
        run: bun run test:server
      
      - name: Type check server
        run: bun run check
        working-directory: ./server

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run client tests
        run: bun run test:client
      
      - name: Type check client
        run: bun run check
        working-directory: ./client
      
      - name: Build client
        run: bun run build
        working-directory: ./client

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run type check
        run: bun run check

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Check formatting
        run: bun run format:check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install
      
      - name: Run tests with coverage
        run: bun run test:coverage
      
      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ github.run_id }}
          path: ./coverage/lcov.info
          if-no-files-found: error
