name: Sync upstream
on:
  schedule: [{cron: "43 4 * * *"}]
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0
      - name: Sync from openRin/Rin
        run: |
          git remote add upstream https://github.com/openRin/Rin.git
          git fetch upstream main
          git merge upstream/main --no-edit || { echo "NO_UPSTREAM_CHANGES"; exit 0; }
          git push origin main