name: Sync upstream
on:
  schedule: [{cron: '43 4 * * *'}]  # UTC 4:43 daily
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {token: ${{ secrets.GITHUB_TOKEN }}}
      - name: Sync from openRin/Rin
        run: gh repo sync ${{ github.repository }} --source openRin/Rin --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
